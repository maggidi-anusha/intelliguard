server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxied to backend-core on the internal network. The original Host header is kept, so
    # the backend sees the browser's origin as its own (same-origin, no CORS needed).
    location /api/ {
        proxy_pass http://backend-core:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Built assets have content hashes in their names: cache them; never cache index.html.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (client routes, refreshes) get index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
