spring.application.name=backend-core

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/intelliguard}
spring.datasource.username=${DB_USERNAME:intelliguard}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Boot's default error response drops the exception message (e.g. our
# ResponseStatusException reasons like "A service named 'x' already exists"), leaving only the
# generic HTTP reason phrase ("Conflict"). Every message we throw is already written to be
# client-safe, so include it - otherwise the frontend has nothing useful to show on failure.
server.error.include-message=always

jwt.secret=${JWT_SECRET:}

# The simulator's ADMIN account, created at startup by AdminAccountSeeder (public registration
# can't create ADMIN accounts). Seeding is skipped when no password is set.
intelliguard.seed-admin.username=${SIMULATOR_ADMIN_USERNAME:simulator-admin}
intelliguard.seed-admin.password=${SIMULATOR_ADMIN_PASSWORD:}
intelliguard.seed-admin.email=${SIMULATOR_ADMIN_EMAIL:simulator-admin@intelliguard.local}

# --- Anomaly + risk scoring job (RiskScoringJob) ---
intelliguard.scoring.enabled=${INTELLIGUARD_SCORING_ENABLED:true}
intelliguard.scoring.interval-ms=${INTELLIGUARD_SCORING_INTERVAL_MS:10000}
# 72 ticks of 5 s = 6 minutes; ml-service's L1 needs 61 samples per metric (window 60 + 1).
intelliguard.scoring.window-ticks=72
intelliguard.scoring.min-samples-per-metric=61
intelliguard.scoring.close-after-cycles=3
intelliguard.scoring.ml-url=${INTELLIGUARD_ML_URL:http://ml-service:8000}
intelliguard.scoring.ml-timeout=2s
intelliguard.scoring.stale-after=60s
intelliguard.scoring.recent-window=5m
intelliguard.scoring.anomaly-retention=7d

# --- Risk engine (RiskCalculator; see docs/risk-engine.md). Weights must sum to 1. ---
intelliguard.risk.weights.ml=0.40
intelliguard.risk.weights.l0=0.20
intelliguard.risk.weights.criticality=0.10
intelliguard.risk.weights.errors=0.15
intelliguard.risk.weights.security=0.15
intelliguard.risk.levels.medium=30
intelliguard.risk.levels.high=55
intelliguard.risk.levels.critical=75
intelliguard.risk.error-rate-cap=5
intelliguard.risk.security-event-cap=10
intelliguard.risk.persist-min-interval=60s
intelliguard.risk.persist-min-delta=5
intelliguard.risk.retention=24h
