spring.application.name=backend-core

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/intelliguard}
spring.datasource.username=${DB_USERNAME:intelliguard}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Spring Boot's default error response drops the exception message (e.g. our
# ResponseStatusException reasons like "A service named 'x' already exists"), leaving only the
# generic HTTP reason phrase ("Conflict"). Every message we throw is already written to be
# client-safe, so include it - otherwise the frontend has nothing useful to show on failure.
server.error.include-message=always

jwt.secret=${JWT_SECRET:}
