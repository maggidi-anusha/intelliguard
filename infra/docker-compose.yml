services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intelliguard
      POSTGRES_USER: intelliguard
      POSTGRES_PASSWORD: intelliguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  backend-core:
    build: ../backend-core
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/intelliguard
      DB_USERNAME: intelliguard
      DB_PASSWORD: intelliguard

  ml-service:
    build: ../ml-service
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend-core

volumes:
  pgdata:
